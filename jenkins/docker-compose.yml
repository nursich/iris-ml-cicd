# Local Jenkins server.
#   Start:  docker compose -f jenkins/docker-compose.yml up -d --build
#   Open:   http://localhost:8080
#   Password for the first login:
#           docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root            # needed to use the mounted Docker socket on Docker Desktop
    ports:
      - "8080:8080"       # Jenkins web UI
      - "50000:50000"     # inbound agents
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci-net

volumes:
  jenkins_home:

networks:
  ci-net:
    name: ci-net
